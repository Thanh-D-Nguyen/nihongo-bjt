name: Deploy Oracle production

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: oracle-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.event == 'push' &&
           github.event.workflow_run.head_branch == 'main' &&
           github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: [self-hosted, Linux, ARM64, kotobawork-oci]
    timeout-minutes: 75
    environment:
      name: oracle-production
      url: https://${{ vars.OCI_PUBLIC_HOST }}/vi
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
      OCI_PUBLIC_HOST: ${{ vars.OCI_PUBLIC_HOST }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Verify CI passed for the deployed SHA
        run: |
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
          bash scripts/quality/verify-ci-passed.sh "$DEPLOY_SHA"
      - name: Release validated source to Oracle
        run: bash deploy/oci/deploy-release.sh
