name: Deploy GCP production

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: gcp-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Only deploy when CI succeeded for a push to main (not a PR whose head
    # branch happens to be named "main"), or when triggered manually.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.event == 'push' &&
           github.event.workflow_run.head_branch == 'main') }}
    environment:
      name: production
      url: https://app.34-87-55-1.sslip.io/vi
    steps:
      - uses: actions/checkout@v4
        with:
          # Deploy exactly the commit CI validated. Without this, a workflow_run
          # job checks out main's *current* HEAD, which may be a newer commit
          # whose CI failed or is still running.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Configure SSH
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.GCP_VM_SSH_KNOWN_HOSTS }}
          SSH_PRIVATE_KEY: ${{ secrets.GCP_VM_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/gcp-deploy
          chmod 600 ~/.ssh/gcp-deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Sync release files
        env:
          GCP_VM_HOST: ${{ secrets.GCP_VM_HOST }}
          GCP_VM_USER: ${{ secrets.GCP_VM_USER }}
        run: |
          rsync -az --delete-delay \
            --exclude='.env' \
            --exclude='.git/' \
            --exclude='.turbo/' \
            --exclude='**/.next/' \
            --exclude='**/dist/' \
            --exclude='node_modules/' \
            --exclude='**/node_modules/' \
            --exclude='**/.turbo/' \
            --exclude='deploy/gcp/runtime/' \
            -e 'ssh -i ~/.ssh/gcp-deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes' \
            ./ "$GCP_VM_USER@$GCP_VM_HOST:/home/deploy/nihongo-bjt/"
      - name: Write production .env on VM
        env:
          GCP_VM_HOST: ${{ secrets.GCP_VM_HOST }}
          GCP_VM_USER: ${{ secrets.GCP_VM_USER }}
          PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
        run: |
          printf '%s' "$PROD_ENV_FILE" | ssh -i ~/.ssh/gcp-deploy \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$GCP_VM_USER@$GCP_VM_HOST" \
            'umask 077 && cat > /home/deploy/nihongo-bjt/.env'
      - name: Build and restart production
        env:
          GCP_VM_HOST: ${{ secrets.GCP_VM_HOST }}
          GCP_VM_USER: ${{ secrets.GCP_VM_USER }}
        run: |
          ssh -i ~/.ssh/gcp-deploy \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$GCP_VM_USER@$GCP_VM_HOST" \
            'cd /home/deploy/nihongo-bjt && chmod +x deploy/gcp/*.sh && ./deploy/gcp/deploy-release.sh'
