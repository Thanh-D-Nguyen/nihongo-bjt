services:
  postgres:
    volumes:
      - /srv/kotobawork/data/postgres:/var/lib/postgresql/data
  redis:
    volumes:
      - /srv/kotobawork/data/redis:/data
  meilisearch:
    mem_limit: 4g
    environment:
      MEILI_MAX_INDEXING_MEMORY: 2 GiB
    volumes:
      - /srv/kotobawork/data/meili:/meili_data
  minio:
    image: kotobawork-minio:7aac2a2
    volumes:
      - /srv/kotobawork/data/minio:/data
  keycloak-db:
    volumes:
      - /srv/kotobawork/data/keycloak-db:/var/lib/postgresql/data
  keycloak:
    volumes:
      - /srv/kotobawork/data/keycloak:/opt/keycloak/data
      - ./runtime/nihongo-bjt-realm.json:/opt/keycloak/data/import/nihongo-bjt-realm.json:ro
